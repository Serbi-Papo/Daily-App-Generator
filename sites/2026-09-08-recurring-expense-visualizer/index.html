<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recurring Expense Visualizer</title>
  <style>
    :root {
      --bg-base: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #26354a;
      --bg-input: #0f172a;
      --border-color: #334155;
      --border-focus: #10b981;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --accent-emerald: #10b981;
      --accent-emerald-hover: #059669;
      --accent-emerald-dim: rgba(16, 185, 129, 0.15);
      --accent-indigo: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-amber: #f59e0b;
      --accent-purple: #8b5cf6;
      --accent-rose: #f43f5e;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
      
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      padding-bottom: 60px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout Components */
    .app-header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background-color: var(--accent-emerald);
      color: #042f2e;
      border: none;
    }

    .btn-primary:hover {
      background-color: var(--accent-emerald-hover);
      color: #ffffff;
    }

    .btn-danger {
      background-color: rgba(244, 63, 94, 0.1);
      color: var(--accent-rose);
      border-color: rgba(244, 63, 94, 0.3);
    }

    .btn-danger:hover {
      background-color: var(--accent-rose);
      color: #fff;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-main);
    }

    .container {
      max-width: 1280px;
      margin: 24px auto 0;
      padding: 0 24px;
    }

    /* Overview Section */
    .overview-banner {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
    }

    .banner-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .banner-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Frequency Switcher Pills */
    .period-toggle {
      display: flex;
      background-color: var(--bg-base);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .period-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .period-btn.active {
      background-color: var(--accent-emerald);
      color: #042f2e;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .kpi-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      position: relative;
      overflow: hidden;
    }

    .kpi-card.highlight {
      border-color: var(--accent-emerald);
      background: linear-gradient(135deg, rgba(30, 41, 59, 1) 0%, rgba(16, 185, 129, 0.05) 100%);
    }

    .kpi-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .kpi-subtext {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Dashboard Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-group input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-emerald);
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Charts & Breakdown */
    .chart-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
      position: relative;
    }

    .svg-chart-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .svg-chart {
      width: 200px;
      height: 200px;
      transform: rotate(-90deg);
    }

    .chart-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .chart-center-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.1;
    }

    .chart-center-lbl {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .chart-legend {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }

    .legend-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-val {
      font-weight: 600;
      color: var(--text-main);
    }

    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .bar-item-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .bar-track {
      height: 8px;
      background-color: var(--bg-input);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* Controls Bar above List */
    .list-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
    }

    /* Table / Subscription Cards */
    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .expense-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 2fr 1fr 1.5fr auto;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .expense-item:hover {
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }

    .item-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-notes {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .category-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      width: fit-content;
      white-space: nowrap;
    }

    .item-cost-container {
      text-align: right;
    }

    .item-cost-main {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .item-cost-sub {
      font-size: 11px;
      color: var(--text-dim);
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-main);
    }

    .btn-icon.delete:hover {
      background-color: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border-color: var(--accent-rose);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      background-color: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-lg);
    }

    .empty-state h3 {
      font-size: 16px;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
